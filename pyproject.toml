# Vercel builds the API from this file. requirements.txt carries the identical
# list so whichever one the platform reads installs the same packages.
#
# Deliberately not backend/requirements.txt: uvicorn is unused where Vercel
# supplies the server, and pytest and httpx are test-only.
[project]
name = "unmapped-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "SQLAlchemy==2.0.43",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "python-dotenv==1.1.1",
  # Only used when DATABASE_URL points at Postgres; harmless otherwise.
  "psycopg[binary]==3.2.3",
]

# Name the entrypoint rather than relying on filename detection, so adding a
# main.py or app.py anywhere later cannot silently move it.
[tool.vercel]
entrypoint = "server:app"
