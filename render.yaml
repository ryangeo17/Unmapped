services:
  - type: web
    name: unmapped-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      # Must list the exact frontend origins, scheme and all, or every API
      # call is blocked by CORS the moment the site goes up. Vercel gives you
      # both a production domain and a per-deploy preview domain; include the
      # ones you actually use. No trailing slash.
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////var/data/unmapped.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: unmapped-data
      mountPath: /var/data
      sizeGB: 1
