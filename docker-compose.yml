services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting UnMapped}
      DATABASE_URL: sqlite:////data/unmapped.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173,http://127.0.0.1:8080
    volumes:
      - unmapped-data:/data
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
        VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:?Set a public Mapbox access token}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  unmapped-data:
